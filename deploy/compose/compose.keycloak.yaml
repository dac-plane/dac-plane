# A reference OIDC issuer for an operated pilot (#96): Keycloak in production
# mode with its own PostgreSQL, joined to the pilot's Compose project. ADR-0009
# leaves the identity provider to the operator; this overlay is one such
# choice, not a dependency of dac-plane. An operator with another issuer drops
# it and points identity.json and DAC_ADAPTER_TOKEN_URL at that issuer.
#
# KC_HOSTNAME fixes the issuer to https://keycloak:8443, so every token carries
# the same `iss` whether it was requested inside the Compose network or through
# the published port. Callers outside the network connect to the published
# port and keep the name `keycloak` for TLS, for example with
# `curl --connect-to keycloak:8443:HOST:PORT`.
services:
  keycloak-db:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    # Secrets are read from files at start, so they stay out of the container's
    # environment as Compose records it. The bootstrap admin exists only until
    # configure-pilot.sh replaces it with a permanent admin.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        && exec /opt/keycloak/bin/kc.sh start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://keycloak:8443
      KC_HTTPS_PORT: "8443"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /run/config/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/secrets/keycloak.key
      KC_HEALTH_ENABLED: "true"
      # Health is served on the unpublished management port 9000 over plain
      # HTTP, so the health check below needs no client certificate trust.
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
    configs:
      - source: tls_cert
        target: /run/config/keycloak.crt
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
      - source: tls_key
        target: keycloak.key
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "${DAC_ISSUER_BIND:-127.0.0.1}:${DAC_ISSUER_PORT:-18443}:8443"
    # Healthy means ready: an open port alone admits callers while Keycloak
    # still answers 503 "Bootstrap in progress", and dac-plane exits when its
    # issuer discovery gets that answer. The image has no HTTP client, so the
    # check speaks HTTP over bash's /dev/tcp.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && grep -q '"status": "UP"' <&3
      start_period: 60s
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # The control plane discovers the issuer at start, so it waits for it.
  dac-plane:
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  keycloak-db-data:

secrets:
  keycloak_db_password:
    file: ${DAC_KEYCLOAK_DB_PASSWORD_FILE:?set DAC_KEYCLOAK_DB_PASSWORD_FILE}
  keycloak_admin_password:
    file: ${DAC_KEYCLOAK_ADMIN_PASSWORD_FILE:?set DAC_KEYCLOAK_ADMIN_PASSWORD_FILE}
