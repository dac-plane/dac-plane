# TLS passthrough for the artifact store (compose.artifacts.yaml). SeaweedFS
# shares this container's network namespace and binds only loopback; this
# proxy exposes only its HTTPS S3 port, and SeaweedFS terminates TLS itself.
global
  log stdout format raw local0 warning

defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 10m
  timeout server 10m

frontend s3
  bind :8443
  default_backend seaweedfs

backend seaweedfs
  server local 127.0.0.1:9443
