name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dacp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dacp
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: for f in services/product-tasks/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Constraint tests
        run: for f in services/product-tasks/test/sql/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
