name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# See ci.yml: a run called by a release is keyed by commit and never cancelled.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}${{ github.workflow != 'security' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.workflow == 'security' }}

permissions:
  contents: read

env:
  JUST_VERSION: 1.57.0

jobs:
  acceptance:
    name: Security and lifecycle acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up tools
        uses: ./.github/actions/setup
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Pre-pull PostgreSQL test image
        run: docker pull postgres:16.15-alpine || true

      - name: Run security and lifecycle tests under race
        run: just test-security-race
