name: security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JUST_VERSION: 1.57.0

jobs:
  acceptance:
    name: Security and lifecycle acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up tools
        uses: ./.github/actions/setup
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Pre-pull PostgreSQL test image
        run: docker pull postgres:16.15-alpine || true

      - name: Run security and lifecycle tests under race
        run: just test-security-race
