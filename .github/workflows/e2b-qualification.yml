name: E2B Cloud qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Managed E2B Cloud live qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go and just
        uses: ./.github/actions/setup
        with:
          just-version: 1.57.0

      - name: Set up Node.js for pinned E2B CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Run live E2B Cloud qualification
        env:
          APIKEY_E2B: ${{ secrets.APIKEY_E2B }}
        run: just qualify-e2b-environment

      - name: Upload sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2b-cloud-qualification-${{ github.run_id }}
          path: |
            .work/e2b-qualification/host.txt
            .work/e2b-qualification/e2b-cli-version.txt
            .work/e2b-qualification/live-test.txt
          if-no-files-found: warn
          retention-days: 14
