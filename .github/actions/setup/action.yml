name: setup
description: Set up Go and just after checking out the repository.

inputs:
  go-version:
    description: Go version to install.
    default: 1.27.4
  go-cache:
    description: Whether setup-go restores the module and build cache.
    default: 'true'
  just-version:
    description: just version to install.
    required: true

outputs:
  go-version:
    description: Installed Go version, for cache keys.
    value: ${{ steps.go.outputs.go-version }}

runs:
  using: composite
  steps:
    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.go-cache }}

    - name: Set up just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: ${{ inputs.just-version }}
