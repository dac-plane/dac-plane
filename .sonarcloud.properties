# SonarCloud Automatic Analysis scope.
#
# Test files are excluded from duplication detection only: fixtures and
# table-driven cases legitimately repeat arrange-act-assert shapes, and the
# gate's duplication budget is meant for production code, which stays fully
# gated. This changes no quality-gate threshold; those live in the SonarCloud
# UI and cannot be set from the codebase.
sonar.cpd.exclusions=**/*_test.go

# Excluded from analysis:
# - architecture-explore/: retained research that never ships; it is evidence,
#   not the active product.
# - docs/guides/reference/api.html: static HTML that loads the pinned Redoc
#   bundle. Its Content-Security-Policy must allow inline styles, because Redoc
#   injects its styles at run time and the page does not render without them;
#   the page's comment says so. Automatic analysis cannot ignore one rule on one
#   file, so the page is left out of analysis instead.
sonar.exclusions=architecture-explore/**,docs/guides/reference/api.html
